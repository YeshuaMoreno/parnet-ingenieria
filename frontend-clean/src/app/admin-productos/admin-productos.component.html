<div class="min-h-screen bg-gray-100 p-8">

  <div class="flex justify-between items-center mb-6">

  <h1 class="text-4xl font-bold text-blue-900">
    Administración de Productos
  </h1>

  <div class="flex gap-3">
    <a
      routerLink="/dashboard"
      class="bg-gray-700 text-white px-5 py-3 rounded-lg font-bold hover:bg-gray-800">
      Dashboard
    </a>

    <a
      routerLink="/admin-servicios"
      class="bg-purple-700 text-white px-5 py-3 rounded-lg font-bold hover:bg-purple-800">
      Servicios
    </a>

    <a
      routerLink="/admin-sugerencias"
      class="bg-green-700 text-white px-5 py-3 rounded-lg font-bold hover:bg-green-800">
      Sugerencias
    </a>
  </div>

</div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold mb-4">
        {{ editando ? 'Editar producto' : 'Nuevo producto' }}
      </h2>

      <form (ngSubmit)="guardar()" class="space-y-3">

        <input [(ngModel)]="producto.nombre" name="nombre"
               class="w-full border p-3 rounded-lg"
               placeholder="Nombre del producto" required>

        <select [(ngModel)]="producto.categoria"
              name="categoria"
              class="w-full border p-3 rounded-lg bg-white"
              aria-label="Categoría del producto"
              title="Categoría del producto"
              required>

          <option value="" disabled>
            Selecciona una categoría
          </option>

          <option value="Cableado estructurado">
            Cableado estructurado
          </option>

          <option value="Telecomunicaciones">
            Telecomunicaciones
          </option>

          <option value="CCTV">
            CCTV
          </option>

          <option value="Redes">
            Redes
          </option>

          <option value="Corriente regulada">
            Corriente regulada
          </option>

          <option value="Data centers">
            Data centers
          </option>

          <option value="Seguridad electrónica">
            Seguridad electrónica
          </option>

          <option value="Servicios de ingeniería">
            Servicios de ingeniería
          </option>

        </select>

        <textarea [(ngModel)]="producto.descripcion" name="descripcion"
                  class="w-full border p-3 rounded-lg"
                  placeholder="Descripción"></textarea>

        <input [(ngModel)]="producto.precio" name="precio"
               type="number"
               class="w-full border p-3 rounded-lg"
               placeholder="Precio">

        <select [(ngModel)]="producto.estatus"
              name="estatus"
              class="w-full border p-3 rounded-lg"
              aria-label="Estatus del producto"
              title="Estatus del producto">

        <input type="file"
            accept="image/*"
            (change)="subirImagen($event)"
            class="w-full border p-3 rounded-lg"
            aria-label="Seleccionar imagen del producto"
            title="Seleccionar imagen del producto">

        <input [(ngModel)]="producto.imagen"
              name="imagen"
              class="w-full border p-3 rounded-lg"
              placeholder="URL de imagen"
              readonly>

        <img *ngIf="imagenPreview"
          [src]="imagenPreview"
          alt="Vista previa de la imagen del producto"
          title="Vista previa de la imagen del producto"
          class="w-full h-40 object-cover rounded-lg border">

        <button type="submit"
                class="w-full bg-blue-900 text-white p-3 rounded-lg font-bold">
          {{ editando ? 'Actualizar' : 'Guardar' }}
        </button>

        <button type="button"
                (click)="resetForm()"
                class="w-full bg-gray-500 text-white p-3 rounded-lg font-bold">
          Limpiar
        </button>

      </form>
    </div>

    <div class="lg:col-span-2 bg-white rounded-xl shadow p-6">

      <div class="flex gap-2 mb-4">
        <input [(ngModel)]="busqueda"
               class="border p-3 rounded-lg w-full"
               placeholder="Buscar producto..."
               (keyup.enter)="buscar()">

        <button type="button"
                (click)="buscar()"
                class="bg-blue-900 text-white px-4 rounded-lg">
          Buscar
        </button>
      </div>

      <div class="flex gap-2 mb-4">
        <button type="button" 
                (click)="abrirReportePdf()"
                class="bg-red-700 text-white px-4 py-2 rounded-lg">
          Reporte PDF
        </button>

        <button type="button" 
                (click)="abrirReporteExcel()"
                class="bg-green-700 text-white px-4 py-2 rounded-lg">
          Reporte Excel
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full border">
          <thead class="bg-blue-900 text-white">
            <tr>
              <th class="p-2">ID</th>
              <th class="p-2">Producto</th>
              <th class="p-2">Categoría</th>
              <th class="p-2">Precio</th>
              <th class="p-2">Estatus</th>
              <th class="p-2">Acciones</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let p of productos" class="border-b">
              <td class="p-2">{{ p.id }}</td>
              <td class="p-2">{{ p.nombre }}</td>
              <td class="p-2">{{ p.categoria }}</td>
              <td class="p-2">${{ p.precio }}</td>
              <td class="p-2">{{ p.estatus }}</td>
              <td class="p-2 flex gap-2">
                <button type="button"
                        (click)="editar(p)"
                        class="bg-yellow-500 text-white px-3 py-1 rounded">
                Editar
                </button>

                <button type="button"
                        (click)="eliminar(p.id)"
                        class="bg-red-600 text-white px-3 py-1 rounded">
                Eliminar
                </button>

                <button type="button"
                        (click)="abrirPdf(p.id)"
                        class="bg-purple-700 text-white px-3 py-1 rounded">
                PDF
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>

</div>
